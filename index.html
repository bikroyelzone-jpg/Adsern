<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adsern Pro | Earning Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        :root { --p: #0ea5e9; --bg: #020617; }
        body { background: var(--bg); color: white; font-family: 'Outfit', sans-serif; overflow: hidden; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.05); border-radius: 40px; }
        .btn-premium { background: linear-gradient(135deg, #0ea5e9, #3b82f6); box-shadow: 0 10px 25px rgba(14, 165, 233, 0.2); }
        .input-pro { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 18px; width: 100%; outline: none; transition: 0.3s; }
        .input-pro:focus { border-color: #0ea5e9; }
        
        /* AD PLAYER */
        #ad-box { position: fixed; inset: 0; background: #000; z-index: 9000; display: none; flex-direction: column; }
        #ad-top { height: 10%; background: #0f172a; display: flex; items: center; justify-content: space-between; padding: 0 25px; border-bottom: 2px solid #0ea5e9; }
        #ad-view { height: 90%; width: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020617] flex items-center justify-center p-6">
        <div class="glass p-10 w-full max-w-md text-center space-y-6">
            <h1 class="text-4xl font-black italic">ADSERN<span class="text-sky-500">.</span></h1>
            <input type="email" id="auth-email" placeholder="Email Address" class="input-pro mb-3">
            <input type="password" id="auth-pass" placeholder="Password" class="input-pro mb-3">
            <button onclick="handleAuth()" id="auth-btn" class="btn-premium w-full py-5 rounded-2xl font-black uppercase">Start Earning</button>
            <p onclick="toggleAuthMode()" id="toggle-text" class="text-sky-400 text-sm font-bold cursor-pointer mt-4">New? Sign Up</p>
        </div>
    </div>

    <div id="main-app" class="hidden h-screen overflow-y-auto pb-32 pt-6">
        
        <header class="px-8 flex justify-between items-center mb-8 sticky top-0 bg-[#020617]/90 py-4 z-40">
            <h1 class="text-2xl font-black italic">ADSERN</h1>
            <div class="glass px-5 py-2 flex items-center gap-3 border-sky-500/20">
                <i class="fa-solid fa-coins text-yellow-400"></i>
                <span id="h-coins" class="font-black">0</span>
            </div>
        </header>

        <section id="p-home" class="px-6">
            <div class="glass p-10 text-center relative overflow-hidden">
                <p class="text-[10px] font-black tracking-[0.4em] text-slate-500 mb-2 uppercase">Revenue Engine</p>
                <h2 class="text-2xl font-black mb-10">Premium Ad Stream</h2>
                <div class="w-24 h-24 bg-sky-500/10 rounded-full mx-auto flex items-center justify-center mb-10 border border-sky-500/30">
                    <i class="fa-solid fa-play text-sky-500 text-3xl"></i>
                </div>
                <button onclick="launchAd()" class="btn-premium w-full py-6 rounded-[30px] font-black text-lg tracking-widest">CLAIM REWARD</button>
            </div>
        </section>

        <section id="p-wallet" class="hidden px-6 space-y-6">
            <div class="glass p-10 bg-gradient-to-br from-sky-500/10 to-transparent border-t-2 border-sky-500">
                <p class="text-slate-500 text-[11px] font-black uppercase tracking-widest mb-3">Available Balance</p>
                <h1 id="bdt-val" class="text-5xl font-black tracking-tighter">৳ 0.0000</h1>
                <div class="flex justify-between items-center mt-8">
                    <span id="usd-val" class="text-slate-400 text-xs font-bold">$ 0.00 USD</span>
                    <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-black px-3 py-1 rounded-full border border-emerald-500/20">VERIFIED</span>
                </div>
            </div>

            <div class="glass p-8">
                <h3 class="font-black text-sm uppercase tracking-widest mb-6 text-sky-400"><i class="fa-solid fa-gift mr-2"></i> Redeem Earnings</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-4 glass border-white/5 text-center">
                        <i class="fa-solid fa-mobile-screen text-2xl mb-2 text-sky-400"></i>
                        <p class="text-[10px] font-bold">Mobile Recharge</p>
                    </div>
                    <div class="p-4 glass border-white/5 text-center">
                        <i class="fa-solid fa-wallet text-2xl mb-2 text-emerald-400"></i>
                        <p class="text-[10px] font-bold">Bkash/Nagad</p>
                    </div>
                </div>
                
                <div class="mt-8 space-y-4">
                    <input type="number" id="w-amount" placeholder="Enter Amount ($)" class="input-pro">
                    <select id="w-method" class="input-pro bg-slate-900">
                        <option value="bkash">bKash (Personal)</option>
                        <option value="nagad">Nagad (Personal)</option>
                        <option value="binance">Binance (USDT)</option>
                    </select>
                    <input type="text" id="w-account" placeholder="Account Number" class="input-pro">
                    <button onclick="requestWithdraw()" class="btn-premium w-full py-5 rounded-2xl font-black tracking-widest uppercase shadow-xl">Confirm Withdraw</button>
                </div>
            </div>
            
            <p class="text-center text-[9px] text-slate-600 font-bold uppercase tracking-[0.2em]">Minimum Payout: $5.00</p>
        </section>

        <section id="p-profile" class="hidden px-6 text-center space-y-6">
            <div class="pt-6">
                <div class="w-32 h-32 rounded-[50px] border-4 border-sky-500/20 p-2 mx-auto overflow-hidden">
                    <img id="u-pfp" src="https://ui-avatars.com/api/?background=0ea5e9&color=fff&name=A" class="rounded-[40px] w-full h-full object-cover">
                </div>
                <h2 id="u-name" class="text-3xl font-black mt-6 tracking-tight">Arman <i class="fa-solid fa-circle-check text-sky-500 text-sm"></i></h2>
                <p id="u-ebid" class="text-slate-500 text-[10px] font-black tracking-[0.4em] mt-2">EB ID: 000000000</p>
            </div>
            <div class="glass p-2">
                <div onclick="logout()" class="p-6 text-red-500 font-black tracking-widest text-xs cursor-pointer">SIGNOUT SESSION</div>
            </div>
        </section>

        <nav class="fixed bottom-0 left-0 w-full glass rounded-t-[50px] p-8 flex justify-around items-center z-50 border-t border-white/10">
            <i onclick="navigate('home')" id="n-home" class="fa-solid fa-house text-2xl text-sky-500 cursor-pointer"></i>
            <i onclick="navigate('wallet')" id="n-wallet" class="fa-solid fa-wallet text-2xl text-slate-600 cursor-pointer"></i>
            <i onclick="navigate('profile')" id="n-profile" class="fa-solid fa-user-gear text-2xl text-slate-600 cursor-pointer"></i>
        </nav>
    </div>

    <div id="ad-box">
        <div id="ad-top">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest animate-pulse">Streaming Secured Content</span>
            <div class="bg-sky-500/10 px-6 py-2 rounded-2xl border border-sky-500/40">
                <span id="ad-timer" class="font-black text-sky-400 text-2xl">30</span>
            </div>
        </div>
        <div id="ad-view"><iframe id="ad-frame" src=""></iframe></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEy2Hez7CaVfxQbC7SwnIHfFm0OxgRRuY",
            authDomain: "adsern-1fefd.firebaseapp.com",
            databaseURL: "https://adsern-1fefd-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "adsern-1fefd",
            storageBucket: "adsern-1fefd.firebasestorage.app",
            messagingSenderId: "669434656492",
            appId: "1:669434656492:web:d36fd8326232f1d67b17c9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let userData = null;
        let isLogin = false;

        // --- AUTH ENGINE ---
        window.toggleAuthMode = () => {
            isLogin = !isLogin;
            document.getElementById('auth-btn').innerText = isLogin ? "Login Now" : "Start Earning";
            document.getElementById('toggle-text').innerText = isLogin ? "New here? Sign Up" : "Already have account? Login";
        };

        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return alert("Fill all fields");

            try {
                if(isLogin) { await signInWithEmailAndPassword(auth, email, pass); }
                else {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    const ebid = Math.floor(100000000 + Math.random() * 900000000);
                    await set(ref(db, `users/${res.user.uid}`), { name: "Arman", coins: 0, ebid: ebid, country: "Bangladesh" });
                }
            } catch(e) { alert(e.message); }
        };

        onAuthStateChanged(auth, (user) => {
            if(user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                onValue(ref(db, `users/${user.uid}`), (snap) => {
                    userData = snap.val();
                    if(userData) syncData();
                });
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        // --- UI & NAV ---
        window.navigate = (id) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.fa-solid').forEach(i => i.classList.replace('text-sky-500', 'text-slate-600'));
            document.getElementById('p-' + id).classList.remove('hidden');
            document.getElementById('n-' + id).classList.replace('text-slate-600', 'text-sky-500');
        };

        function syncData() {
            const coins = userData.coins || 0;
            const usd = (coins * 0.000001).toFixed(8);
            document.getElementById('h-coins').innerText = coins;
            document.getElementById('bdt-val').innerText = `৳ ${(usd * 122).toFixed(4)}`;
            document.getElementById('usd-val').innerText = `$ ${usd} USD`;
            document.getElementById('u-name').innerHTML = `${userData.name} <i class="fa-solid fa-circle-check text-sky-500 text-sm ml-1"></i>`;
            document.getElementById('u-ebid').innerText = "EB ID: " + userData.ebid;
        }

        // --- AD ENGINE ---
        window.launchAd = () => {
            const box = document.getElementById('ad-box');
            document.getElementById('ad-frame').src = "https://www.profitablecpmratenetwork.com/cdhh0gpk5i?key=bca27d8021c615b6d88608426bb5bfd2";
            box.style.display = 'flex';
            let t = 30;
            const timer = setInterval(() => {
                t--; document.getElementById('ad-timer').innerText = t;
                if(t <= 0) { clearInterval(timer); grantReward(); }
            }, 1000);
            window.adT = timer;
        };

        async function grantReward() {
            document.getElementById('ad-box').style.display = 'none';
            document.getElementById('ad-frame').src = "";
            await update(ref(db, `users/${currentUser.uid}`), { coins: (userData.coins || 0) + 10 });
            alert("Success! 10 Coins added to wallet.");
        }

        window.requestWithdraw = () => {
            const amt = document.getElementById('w-amount').value;
            if(amt < 5) return alert("Minimum withdrawal is $5.00");
            alert("Withdraw request for $" + amt + " submitted for manual review.");
        };

        window.logout = () => signOut(auth);

        window.addEventListener('popstate', () => {
            if(document.getElementById('ad-box').style.display === 'flex') {
                clearInterval(window.adT);
                document.getElementById('ad-box').style.display = 'none';
                document.getElementById('ad-frame').src = "";
            }
        });
        history.pushState(null, null, location.href);
    </script>
</body>
</html>
